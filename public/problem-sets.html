<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Server-checked Python problem sets. Answers stay on the server." />
  <title>Problem Sets | Python Playground</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pp-theme');
        var theme = stored || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <!-- Site shell styles, then the page-scoped Problem Sets styles. -->
  <link rel="stylesheet" href="/css/styles.css" />
  <!-- Problem Sets widget fonts: Outfit (UI) + JetBrains Mono (code).
       Scoped to the activity in problem-sets.css so the rest of the site
       keeps its own font stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/problem-sets.css" />
</head>
<body data-page="problems">
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/index.html" class="site-brand">
        <span class="site-brand__mark">[ ]</span>
        <span class="site-brand__name">Python Playground</span>
      </a>
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
        <span class="theme-toggle__icon" aria-hidden="true">☀️</span>
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary">
        <ul class="tab-list" role="tablist">
          <li role="presentation"><a class="tab" data-tab="home"        role="tab" href="/index.html">Home</a></li>
          <li role="presentation"><a class="tab" data-tab="playground"  role="tab" href="/programming-playground.html">Python Programming Playground</a></li>
          <li role="presentation"><a class="tab" data-tab="problems"    role="tab" href="/problem-sets.html">Problem Sets</a></li>
          <li role="presentation"><a class="tab" data-tab="attendance"  role="tab" href="/attendance.html">Attendance Activities</a></li>
          <li role="presentation"><a class="tab" data-tab="aprc"        role="tab" href="/aprc.html">APRC</a></li>
          <li role="presentation"><a class="tab" data-tab="awpc"        role="tab" href="/awpc.html">AWPC</a></li>
          <li role="presentation"><a class="tab" data-tab="arcade"      role="tab" href="/python-arcade.html">Python Arcade</a></li>
          <li role="presentation"><a class="tab" data-tab="about"       role="tab" href="/about.html">About Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="page ps-page">
    <div class="ps-app">
      <!-- 1/4 column: pick a problem set. Rendered by problem-set.js. -->
      <aside class="ps-rail" id="ps-rail" aria-label="Problem sets">
        <p class="ps-note">Loading problem sets...</p>
      </aside>

      <!-- 3/4 column: the selected activity. Rendered by problem-set.js. -->
      <section class="ps-main" id="ps-main" aria-live="polite">
        <p class="ps-note">Pick a problem set from the list.</p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>&copy; <span id="footer-year"></span> Python Playground</p>
    </div>
  </footer>

  <script src="/js/main.js" defer></script>
  <script type="module" src="/js/problem-set.js"></script>
</body>
</html>
