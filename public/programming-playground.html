<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Run and experiment with Python code in the browser." />
  <title>Python Programming Playground | Python Playground</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pp-theme');
        var theme = stored || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
  <!-- Playground-only styles (loaded after the shared sheet). -->
  <link rel="stylesheet" href="/css/playground.css" />

  <!--
    Import map for CodeMirror 6 (loaded from the esm.sh CDN).
    CodeMirror 6 is split across many small packages. The "?external=..."
    query tells esm.sh to leave the shared CodeMirror/Lezer packages as
    bare imports so they all resolve to the SAME copy through this map.
    That single-copy guarantee is what keeps Python highlighting working
    (CodeMirror compares values across packages by identity).
    To upgrade, bump the version numbers below.
  -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state":          "https://esm.sh/@codemirror/state@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@codemirror/view":           "https://esm.sh/@codemirror/view@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@codemirror/language":       "https://esm.sh/@codemirror/language@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@codemirror/commands":       "https://esm.sh/@codemirror/commands@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@codemirror/autocomplete":   "https://esm.sh/@codemirror/autocomplete@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@codemirror/lint":           "https://esm.sh/@codemirror/lint@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@codemirror/search":         "https://esm.sh/@codemirror/search@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@codemirror/lang-python":    "https://esm.sh/@codemirror/lang-python@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@lezer/common":              "https://esm.sh/@lezer/common@1?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@lezer/lr":                  "https://esm.sh/@lezer/lr@1?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@lezer/highlight":           "https://esm.sh/@lezer/highlight@1?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python",
      "@lezer/python":              "https://esm.sh/@lezer/python@1?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands,@codemirror/autocomplete,@codemirror/lint,@codemirror/search,@lezer/common,@lezer/highlight,@lezer/lr,@lezer/python"
    }
  }
  </script>
</head>
<body data-page="playground">
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/index.html" class="site-brand">
        <span class="site-brand__mark">[ ]</span>
        <span class="site-brand__name">Python Playground</span>
      </a>
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
        <span class="theme-toggle__icon" aria-hidden="true">☀️</span>
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary">
        <ul class="tab-list" role="tablist">
          <li role="presentation"><a class="tab" data-tab="home"        role="tab" href="/index.html">Home</a></li>
          <li role="presentation"><a class="tab" data-tab="playground"  role="tab" href="/programming-playground.html">Python Programming Playground</a></li>
          <li role="presentation"><a class="tab" data-tab="problems"    role="tab" href="/problem-sets.html">Problem Sets</a></li>
          <li role="presentation"><a class="tab" data-tab="attendance"  role="tab" href="/attendance.html">Attendance Activities</a></li>
          <li role="presentation"><a class="tab" data-tab="aprc"        role="tab" href="/aprc.html">APRC</a></li>
          <li role="presentation"><a class="tab" data-tab="awpc"        role="tab" href="/awpc.html">AWPC</a></li>
          <li role="presentation"><a class="tab" data-tab="arcade"      role="tab" href="/python-arcade.html">Python Arcade</a></li>
          <li role="presentation"><a class="tab" data-tab="about"       role="tab" href="/about.html">About Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    <section class="page__hero" aria-labelledby="page-title">
      <h1 id="page-title">Python Programming Playground</h1>
    </section>

    <section class="page__body" aria-label="Content">
      <!--
        Interactive Python environment, VS Code-style three-column layout,
        all client side:
          - Assignment rail (left, #pyenv-rail)   — picker, built by JS
          - Coding window   (center, .pyenv__main) — toolbar + editor + output
          - Assignment panel (right, #pyenv-panel) — instructions + tests, built by JS
        Behavior lives in /js/playground.js. The rail and panel are
        populated from the ASSIGNMENTS data model there, so the markup
        below is intentionally just the empty containers.
      -->
      <div class="pyenv" data-exercise-id="intro-1">

        <!-- Left rail: assignment picker (rendered by playground.js). -->
        <nav class="pyenv__rail" id="pyenv-rail" aria-label="Assignments"></nav>

        <!-- Center column: toolbar, editor, then output stacked. -->
        <div class="pyenv__main">
          <div class="pyenv__toolbar">
            <!-- Disabled until Pyodide finishes loading (see playground.js). -->
            <button type="button" class="pyenv__run" id="pyenv-run" disabled>Loading Python...</button>
            <span class="pyenv__status" id="pyenv-status" role="status" aria-live="polite"></span>
          </div>

          <!-- CodeMirror mounts here. -->
          <div class="pyenv__editor" id="pyenv-editor" aria-label="Python code editor"></div>

          <!-- Program output / errors. Cleared at the start of each run. -->
          <section class="pyenv__output-wrap" aria-label="Program output">
            <div class="pyenv__output-bar">Output</div>
            <pre class="pyenv__output" id="pyenv-output" tabindex="0" aria-live="polite"></pre>
          </section>
        </div>

        <!-- Right panel: assignment instructions + tester (rendered by playground.js). -->
        <aside class="pyenv__panel" id="pyenv-panel" aria-label="Assignment and tests"></aside>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>&copy; <span id="footer-year"></span> Python Playground</p>
    </div>
  </footer>

  <script src="/js/main.js" defer></script>
  <!-- Playground-only behavior. ES modules defer by default, matching
       the deferred load of the shared main.js above. -->
  <script type="module" src="/js/playground.js"></script>
</body>
</html>
