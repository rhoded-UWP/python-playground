<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="About the Python Playground site and the team behind it." />
  <title>About Us | Python Playground</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pp-theme');
        var theme = stored || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* Compact link cards for the Workshop section. Small, auto-wrapping tiles
       so multiple links sit side by side without filling the page. */
    .link-cards {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .link-card {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.6rem 0.9rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-ink);
      text-decoration: none;
      font-weight: 600;
      line-height: 1.2;
      transition: border-color 160ms ease, transform 160ms ease;
    }
    .link-card:hover {
      border-color: var(--color-accent);
      transform: translateY(-1px);
    }
    .link-card__icon {
      font-size: 1.25rem;
      line-height: 1;
    }
    .link-card__label { font-size: 0.95rem; }
  </style>
</head>

      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
        <span class="theme-toggle__icon" aria-hidden="true">☀️</span>
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary">
        <ul class="tab-list" role="tablist">
          <li role="presentation"><a class="tab" data-tab="home"        role="tab" href="/index.html">Home</a></li>
          <li role="presentation"><a class="tab" data-tab="playground"  role="tab" href="/programming-playground.html">Python Programming Playground</a></li>
          <li role="presentation"><a class="tab" data-tab="problems"    role="tab" href="/problem-sets.html">Problem Sets</a></li>
          <li role="presentation"><a class="tab" data-tab="attendance"  role="tab" href="/attendance.html">Attendance Activities</a></li>
          <li role="presentation"><a class="tab" data-tab="aprc"        role="tab" href="/aprc.html">APRC</a></li>
          <li role="presentation"><a class="tab" data-tab="awpc"        role="tab" href="/awpc.html">AWPC</a></li>
          <li role="presentation"><a class="tab" data-tab="arcade"      role="tab" href="/python-arcade.html">Python Arcade</a></li>
          <li role="presentation"><a class="tab" data-tab="about"       role="tab" href="/about.html">About Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    <section class="page__hero" aria-labelledby="page-title">

    </section>

    <section class="page__body" aria-label="Content">
      <article class="content-block">
        <!-- Page content goes here -->
      </article>

    <section class="page__body" aria-labelledby="workshop-heading">
      <h2 id="workshop-heading">Workshop</h2>
      <!-- Add more links by copying a <li> block: set the href, icon, and label. -->
      <ul class="link-cards">
        <li>
          <a class="link-card" href="https://rhoded-uwp.github.io/CtF_v1/" target="_blank" rel="noopener noreferrer">
            <span class="link-card__icon" aria-hidden="true">🚩</span>

            <span class="visually-hidden">Capture the Flag (opens in a new tab)</span>

  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>&copy; <span id="footer-year"></span> Python Playground</p>
    </div>
  </footer>

  <script src="/js/main.js" defer></script>
